<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="L&T CMMB Mumbai & MMR Excavator Sales Intelligence Command Center"><title>L&T CMMB · Mumbai Opportunity Command Center</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#f4f6f8;color:#18212b}.sidebar{background:#10212b}.accent{color:#e87500}.map{height:540px}.leaflet-container{font:inherit}.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(10px)}.nav.active{background:#e87500;color:#fff}.scrollbar::-webkit-scrollbar{width:5px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}</style>
</head>
<body>
<div class="min-h-screen flex">
<aside class="sidebar text-white w-64 p-4 hidden md:flex flex-col fixed inset-y-0"><div class="px-3 py-4 border-b border-white/10"><div class="font-black text-xl tracking-tight">L&T <span class="accent">CMMB</span></div><div class="text-xs text-slate-400 mt-1">Mumbai Sales Intelligence</div></div><nav class="mt-5 space-y-1" id="nav"><button class="nav active w-full text-left px-3 py-3 rounded-lg text-sm" data-view="overview">◉ Overview</button><button class="nav w-full text-left px-3 py-3 rounded-lg text-sm" data-view="map">⌖ Hyperlocal Map</button><button class="nav w-full text-left px-3 py-3 rounded-lg text-sm" data-view="opportunities">⚡ Opportunities</button><button class="nav w-full text-left px-3 py-3 rounded-lg text-sm" data-view="contractors">♙ Contractors</button><button class="nav w-full text-left px-3 py-3 rounded-lg text-sm" data-view="territory">◎ My Territory</button><button class="nav w-full text-left px-3 py-3 rounded-lg text-sm" data-view="pipeline">▣ Pipeline</button><button class="nav w-full text-left px-3 py-3 rounded-lg text-sm" data-view="insights">◒ Insights</button><button class="nav w-full text-left px-3 py-3 rounded-lg text-sm" data-view="sources">◌ Data Sources</button></nav><div class="mt-auto p-3 rounded-xl bg-white/5 text-xs"><div class="text-slate-400">DATA MODE</div><div class="font-bold mt-1">DEMO DATA</div><div class="text-slate-400 mt-2">No live connectors configured. Never treat these records as live intelligence.</div></div></aside>
<main class="md:ml-64 flex-1"><header class="sticky top-0 z-20 glass border-b px-5 py-3 flex items-center gap-4"><div class="md:hidden font-black">L&T <span class="accent">CMMB</span></div><div class="relative flex-1 max-w-2xl"><input id="search" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-orange-200" placeholder="Search projects, contractors, localities, corridors… (e.g. excavation projects near Andheri)"><span class="absolute right-4 top-3 text-slate-400">⌕</span></div><div class="text-right hidden sm:block"><div class="text-xs text-slate-400">DATA REFRESH</div><div class="text-sm font-semibold">Demo snapshot · 08 Sep 2026</div></div></header>
<div id="app" class="p-5 max-w-[1600px] mx-auto"></div></main></div>
<script>
const projects=[
{id:'MMR-DEMO-001',name:'Navi Mumbai Airport Influence Zone Development',loc:'Panvel · Ulwe',type:'Transportation / Mixed Development',work:'Bulk earthwork',stage:'MOBILISATION',value:1850,score:94,contractor:'Demo Infrastructure Consortium',source:'DEMO DATA',confidence:'UNVERIFIED SIGNAL',lat:19.029,lon:73.039,why:['Large-scale land development','Mobilisation stage','High earthwork intensity','MMR growth corridor']},
{id:'MMR-DEMO-002',name:'Thane–Bhiwandi Integrated Logistics Park',loc:'Bhiwandi',type:'Industrial / Warehousing',work:'Site grading',stage:'AWARDED',value:620,score:91,contractor:'Demo Logistics EPC',source:'DEMO DATA',confidence:'UNVERIFIED SIGNAL',lat:19.300,lon:73.058,why:['Large site grading package','Awarded','Logistics cluster','20T crawler relevance high']},
{id:'MMR-DEMO-003',name:'MMR Urban Rail Corridor Package',loc:'Ghatkopar · Thane',type:'Metro / Rail',work:'Excavation',stage:'TENDER LIVE',value:980,score:86,contractor:'Not yet identified',source:'DEMO DATA',confidence:'UNVERIFIED SIGNAL',lat:19.118,lon:72.936,why:['Excavation-intensive scope','Tender live','Major infrastructure']},
{id:'MMR-DEMO-004',name:'BKC Commercial Redevelopment Cluster',loc:'BKC, Mumbai',type:'Commercial / Redevelopment',work:'Basement excavation',stage:'EARTHWORK',value:430,score:91,contractor:'Demo Civil Works',source:'DEMO DATA',confidence:'UNVERIFIED SIGNAL',lat:19.067,lon:72.869,why:['Basement excavation','Earthwork underway','Dense commercial micro-market']},
{id:'MMR-DEMO-005',name:'Taloja Industrial Expansion',loc:'Taloja',type:'Industrial',work:'Foundation excavation',stage:'PLANNING',value:310,score:72,contractor:'Not yet identified',source:'DEMO DATA',confidence:'UNVERIFIED SIGNAL',lat:19.073,lon:73.118,why:['Industrial expansion','Potential foundation excavation']},
{id:'MMR-DEMO-006',name:'JNPA Logistics Belt Expansion',loc:'Nhava Sheva · Uran',type:'Port / Logistics',work:'Land development',stage:'APPROVAL',value:760,score:78,contractor:'Not yet identified',source:'DEMO DATA',confidence:'UNVERIFIED SIGNAL',lat:18.95,lon:72.95,why:['Port/logistics cluster','Land development potential']}
];
let view='overview';
const navLabels={overview:'Mumbai Opportunity Command Center',map:'Hyperlocal Project Intelligence',opportunities:'Prioritized Excavator Leads',contractors:'Customer & Contractor Intelligence',territory:'Salesperson Workspace',pipeline:'CRM / Lead Conversion',insights:'Mumbai Market Intelligence',sources:'Coverage & Source Health'};
function scoreBadge(s){let t=s>=90?'VERY HIGH':s>=75?'HIGH':s>=60?'MEDIUM':'LOW';return `<span class="px-2 py-1 rounded-full text-xs font-bold ${s>=90?'bg-red-50 text-red-700':s>=75?'bg-orange-50 text-orange-700':'bg-slate-100 text-slate-600'}">${s}/100 · ${t}</span>`}
function card(p){return `<article class="bg-white border border-slate-200 rounded-2xl p-4 hover:shadow-md transition cursor-pointer" onclick="showProject('${p.id}')"><div class="flex justify-between gap-3"><div><div class="text-xs text-slate-400">${p.id}</div><h3 class="font-bold mt-1">${p.name}</h3><div class="text-sm text-slate-500 mt-1">⌖ ${p.loc}</div></div>${scoreBadge(p.score)}</div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4 text-sm"><div><div class="text-xs text-slate-400">PROJECT TYPE</div><b>${p.type}</b></div><div><div class="text-xs text-slate-400">WORK</div><b>${p.work}</b></div><div><div class="text-xs text-slate-400">STAGE</div><b>${p.stage}</b></div><div><div class="text-xs text-slate-400">VALUE</div><b>₹${p.value} Cr</b></div></div><div class="mt-4 p-3 rounded-xl bg-orange-50 border border-orange-100"><div class="text-xs font-bold text-orange-700">RECOMMENDED SALES ACTION</div><div class="text-sm mt-1">${p.stage==='MOBILISATION'||p.stage==='EARTHWORK'?'Contact the excavation/civil contractor this week; site activity indicates an immediate equipment conversation.':'Validate contractor identity, excavation scope and timing before outreach.'}</div></div><div class="mt-3 text-xs text-slate-400">Source: ${p.source} · Confidence: ${p.confidence}</div></article>`}
function kpi(label,val,sub){return `<div class="bg-white border rounded-2xl p-4"><div class="text-xs font-semibold text-slate-400 uppercase">${label}</div><div class="text-2xl font-black mt-2">${val}</div><div class="text-xs text-slate-400 mt-1">${sub}</div></div>`}
function overview(){let high=projects.filter(p=>p.score>=85);return `<div class="space-y-5"><div><div class="flex flex-wrap items-end justify-between gap-3"><div><div class="text-xs font-bold accent uppercase tracking-wider">MMR · HYPERLOCAL</div><h1 class="text-3xl font-black mt-1">Mumbai Opportunity Command Center</h1><p class="text-slate-500 mt-1">Project signal → site → contractor → equipment need → sales owner → next action.</p></div><span class="px-3 py-2 bg-amber-50 text-amber-800 rounded-lg text-xs font-bold">DEMO DATA · CONNECTORS NOT CONFIGURED</span></div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${kpi('High-Priority Opportunities',high.length,'Score ≥ 85 · demo snapshot')}${kpi('New Projects · 7 Days','—','Not available in demo mode')}${kpi('Recently Awarded Contracts',projects.filter(p=>p.stage==='AWARDED').length,'Demo records only')}${kpi('Estimated 20T Excavator Opportunities',high.length,'Relevance inferred; not equipment quantity')}${kpi('Active Earthwork Sites',projects.filter(p=>p.stage==='EARTHWORK').length,'Demo records')}${kpi('Relevant Pipeline Value','₹'+projects.reduce((a,p)=>a+p.value,0).toLocaleString()+' Cr','Demo project values')}${kpi('Leads Requiring Action',high.length,'Priority threshold')}${kpi('Follow-Ups Due','—','CRM connector not configured')}</div><section class="bg-white border rounded-2xl overflow-hidden"><div class="p-4 border-b flex justify-between"><div><h2 class="font-bold">MMR Live Opportunity Map</h2><p class="text-xs text-slate-400">Demo locations only · reliable coordinates must be sourced before production use</p></div><button onclick="setView('map')" class="text-sm font-bold accent">Open full map →</button></div><div id="map" class="map"></div></section><div class="grid lg:grid-cols-3 gap-4"><section class="lg:col-span-2"><div class="flex justify-between items-center mb-3"><h2 class="font-bold">Top Excavator Opportunities</h2><button onclick="setView('opportunities')" class="text-sm accent font-bold">View all →</button></div><div class="space-y-3">${high.slice(0,3).map(card).join('')}</div></section><section class="bg-slate-900 text-white rounded-2xl p-5"><div class="text-xs font-bold accent">TODAY'S ACTION ENGINE</div><h2 class="text-xl font-black mt-2">What should I do today?</h2><div class="space-y-4 mt-5 text-sm">${high.slice(0,3).map((p,i)=>`<div><div class="font-bold">${i+1}. ${p.contractor}</div><div class="text-slate-300 mt-1">${p.name} · ${p.score}/100</div><div class="text-slate-400 mt-1">${p.stage==='MOBILISATION'?'Mobilisation window is active.':'Validate scope and decision maker.'}</div></div>`).join('')}</div></section></div></div>`}
function mapView(){return `<div class="space-y-4"><div><div class="text-xs font-bold accent uppercase">MMR GIS</div><h1 class="text-3xl font-black">Hyperlocal Project Intelligence</h1><p class="text-slate-500">Filter by geography, project type, work type and stage. Production architecture should use PostGIS + viewport queries.</p></div><div class="bg-white border rounded-2xl p-3 grid md:grid-cols-5 gap-2"><select class="border rounded-lg p-2 text-sm"><option>MMR · All areas</option><option>Mumbai</option><option>Navi Mumbai</option><option>Thane Region</option><option>Extended MMR</option></select><select class="border rounded-lg p-2 text-sm"><option>All project types</option><option>Transportation</option><option>Buildings</option><option>Utilities</option><option>Industrial</option><option>Earthwork</option></select><select class="border rounded-lg p-2 text-sm"><option>All work types</option><option>Bulk earthwork</option><option>Basement excavation</option><option>Foundation excavation</option><option>Trenching</option><option>Rock excavation</option></select><select class="border rounded-lg p-2 text-sm"><option>All stages</option><option>TENDER LIVE</option><option>AWARDED</option><option>MOBILISATION</option><option>EARTHWORK</option></select><button class="bg-slate-900 text-white rounded-lg text-sm font-bold">Projects Near Me</button></div><div class="bg-white border rounded-2xl overflow-hidden"><div id="map" class="map"></div></div><div class="grid lg:grid-cols-2 gap-4">${projects.map(card).join('')}</div></div>`}
function opportunities(){return `<div><div class="mb-5"><div class="text-xs font-bold accent uppercase">SALES PRIORITY</div><h1 class="text-3xl font-black">Prioritized Excavator Leads</h1><p class="text-slate-500">Transparent 0–100 scoring; every demo score shows its rationale.</p></div><div class="space-y-3">${[...projects].sort((a,b)=>b.score-a.score).map(card).join('')}</div></div>`}
function contractors(){let cs=[...new Set(projects.map(p=>p.contractor))];return `<div><div class="mb-5"><div class="text-xs font-bold accent uppercase">CUSTOMER INTELLIGENCE</div><h1 class="text-3xl font-black">Contractors</h1><p class="text-slate-500">Relationships are never invented. Unknown roles remain “Not yet identified”.</p></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${cs.map(c=>{let ps=projects.filter(p=>p.contractor===c);return `<div class="bg-white border rounded-2xl p-5"><div class="text-xs text-slate-400">CONTRACTOR</div><h3 class="font-bold text-lg mt-1">${c}</h3><div class="mt-4 text-sm">${ps.length} linked demo projects</div><div class="mt-3 space-y-2">${ps.map(p=>`<div class="p-2 bg-slate-50 rounded-lg text-sm">${p.name}<br>${scoreBadge(p.score)}</div>`).join('')}</div><div class="mt-4 text-xs text-slate-400">Contact: not configured · Relationship: unknown</div></div>`}).join('')}</div></div>`}
function territory(){return `<div class="space-y-5"><div><div class="text-xs font-bold accent uppercase">FIELD SALES</div><h1 class="text-3xl font-black">Good Morning, Sales Team</h1><p class="text-slate-500">Territory ownership requires internal CRM/SSO configuration.</p></div><div class="grid md:grid-cols-4 gap-3">${kpi('High-priority new opportunities',3,'Demo')}${kpi('Follow-ups due','—','CRM not connected')}${kpi('New contracts awarded',1,'Demo')}${kpi('Entering mobilisation',1,'Demo')}</div><div class="grid lg:grid-cols-2 gap-4"><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold">My Territory Map</h2><div id="map" class="map mt-3"></div></div><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold">Nearby / Top Leads</h2><div class="space-y-3 mt-4">${projects.slice(0,4).map(p=>`<div class="border rounded-xl p-3"><div class="font-bold">${p.name}</div><div class="text-sm text-slate-500">${p.loc}</div><div class="mt-2">${scoreBadge(p.score)}</div><div class="flex gap-2 mt-3"><button class="px-3 py-2 bg-slate-900 text-white rounded-lg text-xs">CALL CONTRACTOR</button><button class="px-3 py-2 border rounded-lg text-xs">MARK VISITED</button></div></div>`).join('')}</div></div></div></div>`}
function pipeline(){return `<div><div class="mb-5"><div class="text-xs font-bold accent uppercase">CRM-LITE</div><h1 class="text-3xl font-black">Lead Conversion Pipeline</h1><p class="text-slate-500">Demo workflow. Internal CRM data must remain behind authenticated backend services.</p></div><div class="grid md:grid-cols-3 lg:grid-cols-4 gap-3">${['NEW LEAD','REVIEWED','ASSIGNED','CONTRACTOR IDENTIFIED','CONTACTED','REQUIREMENT CONFIRMED','DEMO / MEETING','QUOTATION','NEGOTIATION','WON','LOST','NURTURE'].map(s=>`<div class="bg-white border rounded-2xl p-4 min-h-32"><div class="text-xs font-bold text-slate-400">${s}</div><div class="mt-4 text-2xl font-black">${s==='NEW LEAD'?projects.length:s==='WON'?'0':'—'}</div></div>`).join('')}</div></div>`}
function insights(){return `<div class="space-y-5"><div><div class="text-xs font-bold accent uppercase">MANAGEMENT</div><h1 class="text-3xl font-black">Mumbai Market Intelligence</h1></div><div class="grid lg:grid-cols-2 gap-4"><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold">Opportunity by Micro-market</h2><div class="space-y-3 mt-5">${['Panvel / Ulwe','Bhiwandi','BKC','Taloja','Thane','JNPA / Uran'].map((x,i)=>`<div><div class="flex justify-between text-sm"><span>${x}</span><b>${[94,91,91,72,86,78][i]}</b></div><div class="h-2 bg-slate-100 rounded-full mt-1"><div class="h-2 bg-orange-500 rounded-full" style="width:${[94,91,91,72,86,78][i]}%"></div></div></div>`).join('')}</div></div><div class="bg-slate-900 text-white rounded-2xl p-5"><div class="text-xs font-bold accent">MUMBAI MARKET PULSE</div><p class="text-lg font-semibold mt-3">Demo-only pulse. Production insights must be generated from verified underlying source data and should not be presented as current market fact until connectors are configured.</p></div></div><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold">Heatmap Layers</h2><div class="flex flex-wrap gap-2 mt-4">${['Construction Activity','Excavator Opportunity','Contract Value','New Projects','Earthwork Activity','Sales Leads','Untapped Opportunities','Contractor Concentration'].map(x=>`<button class="px-3 py-2 border rounded-lg text-sm hover:bg-slate-50">${x}</button>`).join('')}</div></div></div>`}
function sources(){let src=['MMRDA','BMC','MSRDC','MahaTenders','CIDCO','NMMC','TMC','KDMC','MBMC','VVMC','MahaRERA','MRVC / Railways','NHAI / MoRTH','Mumbai Port Authority','JNPA','MIDC','MHADA / SRA','Maharashtra Jeevan Pradhikaran','Environmental clearance portals','Corporate disclosures / listed developers'];return `<div><div class="mb-5"><div class="text-xs font-bold accent uppercase">PROVENANCE</div><h1 class="text-3xl font-black">Data Sources & Health</h1><p class="text-slate-500">No API is assumed. Each connector must be classified as official API, feed, structured download, permitted crawler, manual import or licensed feed.</p></div><div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4"><b>DATA CONNECTOR NOT CONFIGURED</b><div class="text-sm mt-1">This prototype intentionally contains no fabricated live records. Configure lawful source connectors before production use.</div></div><div class="bg-white border rounded-2xl overflow-hidden"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="text-left p-3">Source</th><th class="text-left p-3">Ingestion</th><th class="text-left p-3">Status</th><th class="text-left p-3">Last Verified</th></tr></thead><tbody>${src.map(s=>`<tr class="border-t"><td class="p-3 font-semibold">${s}</td><td class="p-3 text-slate-500">Not configured</td><td class="p-3"><span class="text-xs font-bold bg-slate-100 px-2 py-1 rounded">NOT CONNECTED</span></td><td class="p-3 text-slate-400">—</td></tr>`).join('')}</tbody></table></div></div>`}
function render(){const app=document.getElementById('app');app.innerHTML=({overview,map:mapView,opportunities,contractors,territory,pipeline,insights,sources}[view]||overview)();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));if(document.getElementById('map'))initMap()}
function initMap(){const m=L.map('map').setView([19.08,72.96],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(m);projects.forEach(p=>L.marker([p.lat,p.lon]).addTo(m).bindPopup(`<b>${p.name}</b><br>${p.loc}<br>Score: ${p.score}/100<br>${p.work}`))}
function setView(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function showProject(id){const p=projects.find(x=>x.id===id);alert(`${p.name}\n\n${p.loc}\n${p.work} · ${p.stage}\nExcavator Opportunity: ${p.score}/100\n\nWHY: ${p.why.join('\n• ')}\n\nSource: ${p.source}\nConfidence: ${p.confidence}\n\nRecommended action: validate contractor and approach timing before treating as a sales lead.`)}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setView(n.dataset.view));document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.toLowerCase();const found=projects.filter(p=>(p.name+' '+p.loc+' '+p.type+' '+p.work+' '+p.contractor).toLowerCase().includes(q));if(found.length){view='opportunities';render();document.getElementById('app').scrollIntoView();}else alert('No demo record matches. Production search requires configured project/contractor/location indexes.')}});render();
</script></body></html>
